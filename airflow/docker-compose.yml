services:

  postgres:

    image: postgres:16

    container_name: airflow-postgres

    environment:

      POSTGRES_USER: airflow

      POSTGRES_PASSWORD: airflow

      POSTGRES_DB: airflow

    volumes:

      - airflow-postgres-data:/var/lib/postgresql/data

    networks:

      - analytics-network

      - project-analytics-network


  airflow-init:

    image: apache/airflow:3.0.6

    container_name: airflow-init

    env_file:

      - .env

    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/

    depends_on:

      - postgres

    volumes:

      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - /var/run/docker.sock:/var/run/docker.sock

    command:

      - bash

      - -c

      - airflow db migrate

    networks:

      - analytics-network

      - project-analytics-network


  airflow-webserver:

    image: apache/airflow:3.0.6

    container_name: airflow-webserver

    env_file:

      - .env

    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/

    depends_on:

      - postgres

      - airflow-init

    ports:

      - "8080:8080"

    volumes:

      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - /var/run/docker.sock:/var/run/docker.sock

    command: api-server

    networks:

      - analytics-network

      - project-analytics-network


  airflow-scheduler:

    image: apache/airflow:3.0.6

    container_name: airflow-scheduler

    env_file:

      - .env

    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/

    depends_on:

      - postgres

      - airflow-init

    volumes:

      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - /var/run/docker.sock:/var/run/docker.sock

    command: scheduler

    networks:

      - analytics-network

      - project-analytics-network


  airflow-dag-processor:

    image: apache/airflow:3.0.6

    container_name: airflow-dag-processor

    env_file:

      - .env

    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/

    depends_on:

      - postgres

      - airflow-init

    volumes:

      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - /var/run/docker.sock:/var/run/docker.sock

    command: dag-processor

    networks:

      - analytics-network

      - project-analytics-network


  airflow-triggerer:

    image: apache/airflow:3.0.6

    container_name: airflow-triggerer

    env_file:

      - .env

    environment:

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/

    depends_on:

      - postgres

      - airflow-init

    volumes:

      - ./dags:/opt/airflow/dags

      - ./logs:/opt/airflow/logs

      - ./plugins:/opt/airflow/plugins

      - /var/run/docker.sock:/var/run/docker.sock

    command: triggerer

    networks:

      - analytics-network

      - project-analytics-network


  airflow-dbt:

    image: ai-saas-dbt:1.0

    container_name: airflow-dbt

    working_dir: /dbt/project

    volumes:

      - ../dbt/ai_saas_analytics:/dbt/project

      - ${USERPROFILE}/.aws:/root/.aws

      - ${USERPROFILE}/.dbt:/root/.dbt:ro

    command: tail -f /dev/null

    networks:

      - analytics-network

      - project-analytics-network


volumes:

  airflow-postgres-data:


networks:

  analytics-network:

    external: true

  project-analytics-network:

    external: true

    name: ai-saas-product-analytics-platform_analytics-network